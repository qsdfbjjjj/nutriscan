name: nutriscan
description: "NutriScan — сканер продуктов: состав, КБЖУ, Nutri-Score, избранное и история."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Управление состоянием
  provider: ^6.1.2          # базовые сценарии: настройки (тема, язык)
  flutter_bloc: ^9.0.0      # основная логика: поиск, карточка продукта, избранное
  equatable: ^2.0.5         # сравнение состояний по значению
  stream_transform: ^2.1.0  # debounce для поиска

  # Архитектура
  get_it: ^8.0.0            # Dependency Injection

  # Сеть
  dio: ^5.7.0

  # Локальное хранение
  shared_preferences: ^2.3.0
  hive_ce: ^2.6.0
  hive_ce_flutter: ^2.0.0

  # Навигация
  go_router: ^14.6.0

  # Изображения
  cached_network_image: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
